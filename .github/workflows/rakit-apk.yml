name: Rakit APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      # Kunci tanda tangan dibuka dari app/kunci.enc dengan rahasia KUNCI_RAKIT. Tanpa kunci yang sama, APK baru
      # tidak bisa dipasang menimpa versi lama, jadi rakitan dihentikan.
      - name: Buka kunci tanda tangan
        env:
          KUNCI: ${{ secrets.KUNCI_RAKIT }}
        run: |
          if [ -z "$KUNCI" ]; then
            echo "::error::Rahasia KUNCI_RAKIT belum diisi (Settings › Secrets and variables › Actions)."
            exit 1
          fi
          # Spasi/baris baru yang ikut tertempel dibuang.
          KUNCI=$(printf '%s' "$KUNCI" | tr -d '[:space:]')
          export KUNCI
          mkdir -p app/kunci
          if ! openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:KUNCI -in app/kunci.enc -out /tmp/kunci.tar; then
            # Ciri kata sandi (bukan isinya) untuk dicocokkan: panjang dan 8 huruf awal SHA-256.
            echo "::error::KUNCI_RAKIT tidak cocok (panjang ${#KUNCI}, ciri $(printf '%s' "$KUNCI" | sha256sum | cut -c1-8)). Isi ulang rahasianya."
            exit 1
          fi
          tar -xf /tmp/kunci.tar -C app/kunci
          rm -f /tmp/kunci.tar

      # Nomor versi melanjutkan rilis lama (0.1.110 terakhir dari repository pribadi).
      - name: Nomor versi
        run: echo "VERSI=$((110 + ${{ github.run_number }}))" >> "$GITHUB_ENV"

      - name: Rakit aplikasi
        env:
          WINOTE_BUILD: ${{ env.VERSI }}
        run: |
          set -o pipefail
          gradle :app:assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      # Bila gagal, catatan kesalahan disimpan di cabang build-log supaya mudah dibaca.
      - name: Simpan catatan kesalahan
        if: failure()
        run: |
          mkdir -p /tmp/buildlog
          cp build.log /tmp/buildlog/build.log || true
          grep -nE "^e: |^w: .*error|What went wrong|Could not|error:" build.log > /tmp/buildlog/errors.txt || true
          cd /tmp/buildlog
          git init -q
          git checkout -q -b build-log
          git add .
          git -c user.name="WInote" -c user.email="hana-note@users.noreply.github.com" commit -qm "Catatan rakitan ${{ env.VERSI }}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" build-log

      - name: Beri nama file
        run: |
          cp app/build/outputs/apk/release/app-release.apk "WInote-0.1.${{ env.VERSI }}.apk"
          rm -rf app/kunci

      - name: Terbitkan di Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ env.VERSI }}
          name: WInote 0.1.${{ env.VERSI }}
          body: |
            Unduh file **WInote-0.1.${{ env.VERSI }}.apk** di bawah ini dari tablet, lalu buka untuk memasang.
            Versi baru bisa langsung dipasang menimpa versi lama; catatan tetap aman.
          files: WInote-0.1.${{ env.VERSI }}.apk
          make_latest: true
