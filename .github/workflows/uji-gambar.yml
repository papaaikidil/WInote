name: Uji ruang gambar

on:
  workflow_dispatch:
    inputs:
      skrip:
        description: "Skrip uji di .github/uji"
        default: "gambar.sh"

permissions:
  contents: write

jobs:
  uji:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Kosongkan ruang disk
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /opt/hostedtoolcache/CodeQL /usr/local/lib/node_modules || true
          sudo docker image prune -af || true
          df -h /

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      # Hanya untuk uji: ruang gambar boleh dibuka langsung dari adb.
      - name: Rakit APK debug
        run: |
          sed -i 's#android:name="id.goresan.DrawActivity"#android:name="id.goresan.DrawActivity"\n            tools:ignore="ExportedActivity"#' app/src/main/AndroidManifest.xml || true
          python3 - <<'PY'
          import re
          p='app/src/main/AndroidManifest.xml'
          s=open(p).read()
          i=s.index('android:name="id.goresan.DrawActivity"')
          j=s.index('android:exported="false"', i)
          s=s[:j]+'android:exported="true"'+s[j+len('android:exported="false"'):]
          s=s.replace('tools:ignore="ExportedActivity"','')
          open(p,'w').write(s)
          PY
          # Emulator memakai x86_64: pustaka bawaan untuk x86_64 ikut dirakit.
          sed -i 's/abiFilters += listOf(\(.*\))/abiFilters += listOf(\1, "x86_64")/' app/build.gradle.kts
          grep -n "abiFilters" app/build.gradle.kts || true
          gradle :app:assembleDebug --no-daemon

      - name: Izinkan KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Jalankan uji di emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_c
          cores: 4
          ram-size: 4096M
          disk-size: 3000M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front emulated
          script: bash .github/uji/${{ inputs.skrip }}

      # Hasil disimpan di cabang uji-hasil supaya mudah diambil.
      - name: Simpan hasil
        if: always()
        run: |
          mkdir -p uji-hasil && cd uji-hasil
          git init -q
          git checkout -q -b uji-hasil
          git add -A
          git -c user.name="WInote" -c user.email="ci@winote.local" commit -q -m "Hasil uji ruang gambar" || true
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" uji-hasil uji-hasil:uji-hasil-${{ github.ref_name }}
